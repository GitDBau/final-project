<head>
    <meta charset="UTF-8">
    <title>Appointment - FurFECT VET CLINIC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="features.css">
    <link rel="icon" href="paw.png"/>
</head>
<div class="main-container">
    <a href="index.html" class="back-home-btn">
        <span>&larr;</span> HOME
    </a>
    <div class="feature-card">
        <h1 class="title">Book an Appointment</h1>
        <form action="https://api.web3forms.com/submit" method="POST">
            
            <input type="hidden" name="access_key" value="a50a4fb4-9f71-445f-8d09-b2f6012f1229">
            <div class="form-row">
                <div class="form-group">
                    <label>Client Name:</label>
                    <input type="text" name="Client_Name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" name="Contact_Number" placeholder="Enter your contact number" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Pet Name:</label>
                    <input type="text" name="Pet_Name" placeholder="Enter pet's name" required>
                </div>
                <div class="form-group">
                    <label>Service Type:</label>
                    <select name="Service_Type">
                        <option>Check-up</option>
                        <option>Vaccination</option>
                        <option>Grooming</option>
                        <option>Surgery</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Preferred Date:</label>
                    <input type="date" name="Appointment_Date" required>
                </div>
                <div class="form-group">
                    <label>Preferred Time:</label>
                    <input type="time" name="Appointment_Time" required>
                </div>
            </div>
            <div class="form-group">
                <label>Additional Notes:</label>
                <textarea name="Notes" rows="4" placeholder="Describe any concerns..."></textarea>
            </div>
            <button type="submit" class="submit-btn">
                <span class="btn-front">CONFIRM APPOINTMENT</span>
            </button>
        </form>
    </div>
</div>
